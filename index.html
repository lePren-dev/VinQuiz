<!DOCTYPE html><html lang="sv"><head><meta charset="utf-8"><title>Vinquiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#faf6f1;--fg:#2b1d22;--mut:#7a6a6f;--card:#fff;--bd:#e6dcd3;--ac:#7b1e3a;--ok:#2e7d4f;--no:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1315;--fg:#f3e9ea;--mut:#a89599;--card:#271b1e;--bd:#3d2c30;--ac:#e0708f;--ok:#5fc08a;--no:#ff8a80}}
:root[data-theme=dark]{--bg:#1b1315;--fg:#f3e9ea;--mut:#a89599;--card:#271b1e;--bd:#3d2c30;--ac:#e0708f;--ok:#5fc08a;--no:#ff8a80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 Georgia,'Times New Roman',serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0 4px;color:var(--ac)}p.s{color:var(--mut);margin:0 0 18px}
.b{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:13px 14px;margin:0 0 10px;font:inherit;cursor:pointer}
.b:hover:not(:disabled){border-color:var(--ac)}.b:disabled{cursor:default}
.b.off{opacity:.45}.b small{color:var(--mut);display:block}
.b.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.b.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,var(--card))}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:8px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-bottom:18px}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
h2{font-size:21px;line-height:1.3;margin:0 0 16px}
.go{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px 20px;font:inherit;cursor:pointer;width:100%}
.big{font-size:56px;color:var(--ac);margin:10px 0}.lk{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:0 0 12px}
</style></head><body><main id="app"></main>
<script>
const D=[{"n": 1, "t": "Vinodling och Vinframställning", "items": [{"q": "Vad betyder begreppet \"terroir\" inom vinodling?", "a": "Terroir syftar på platsens samlade fysiska miljö, inklusive jordmån, klimat, topografi och odlingssätt, som påverkar vinets karaktär.", "w": ["Terroir är den kemiska sammansättningen i druvans skal, som avgör vinets färg och tanninhalt.", "Terroir är vinmakarens signatur, alltså den stil och teknik som präglar ett visst vinhus.", "Terroir är den process där druvorna jäser spontant med vingårdens egna jästsvampar."]}, {"q": "Vilken art är den viktigaste för vinproduktion?", "a": "Vitis vinifera.", "w": ["Vitis labrusca.", "Vitis riparia.", "Vitis amurensis."]}, {"q": "Vad är en hybrid inom vinodling?", "a": "En korsning mellan två olika arter av vinrankor.", "w": ["En druva som odlas i växthus för att klara kalla klimat.", "En klon av samma druvsort som valts ut för högre avkastning.", "En druva som har modifierats genetiskt för att tåla torka."]}, {"q": "Vad är syftet med ympning av vinrankor?", "a": "Att skydda mot vinlusen genom att använda resistenta amerikanska rotstockar.", "w": ["Att öka druvornas sockerhalt genom att koppla in starkare rotsystem.", "Att skydda mot frost genom att placera rankan närmare marken.", "Att kunna blanda två druvsorter i samma klase för mer komplexitet."]}, {"q": "Vilken roll spelade Pasteur för vinframställningens utveckling?", "a": "Han visade att jästsvampar orsakar jäsning och att syre kan förstöra vin genom oxidation.", "w": ["Han uppfann pastöriseringen av vin och gjorde det möjligt att lagra det på kolsyrad tank.", "Han utvecklade metoden med svavling för att stoppa jäsningen vid önskad sötma.", "Han införde användningen av ekfat för att ge vinet bättre hållbarhet."]}, {"q": "Vad är skillnaden mellan kontinentalt och maritimt klimat för vinodling?", "a": "Kontinentalt klimat har stora temperaturskillnader och risk för frost, medan maritimt klimat har jämnare temperaturer och mer konstant nederbörd.", "w": ["Kontinentalt klimat har milda vintrar och mycket nederbörd, medan maritimt klimat har torra somrar och kalla vintrar.", "Kontinentalt klimat ligger nära havet och är fuktigt, medan maritimt klimat ligger inåt land och är torrt.", "Kontinentalt klimat har kort växtsäsong utan frost, medan maritimt klimat har lång växtsäsong med snö."]}, {"q": "Vad innebär begreppet \"fenolisk mognad\"?", "a": "När druvans skal, kärnor och stjälkar har utvecklat rätt mängd fenoler, tanniner och aromämnen.", "w": ["När druvans sockerhalt har nått sitt maximum och syran har sjunkit till en lägsta nivå.", "När druvorna har uppnått rätt storlek och klasen börjar hänga ned.", "När jäsningen är klar och vinets fenoler har bundit till jästfällningen."]}, {"q": "Vilka är de tre huvudtyperna av bergarter?", "a": "Magmatiska, sedimentära och metamorfa.", "w": ["Basalt, granit och kalksten.", "Skiffer, lera och sandsten.", "Vulkaniska, kristallina och organiska."]}, {"q": "Vad är syftet med beskärning av vinrankor?", "a": "Att skapa balans för bästa skörd, öka kontrollen och minska skadeangrepp.", "w": ["Att öka rankans ålder och förlänga dess livslängd genom att minska rotsystemet.", "Att få rankan att växa högre för att skydda druvorna mot solbränna.", "Att tvinga rankan att blomma tidigare för en tidigare skörd."]}, {"q": "Vad är \"guyot\" för beskärningsmetod?", "a": "En metod där en eller två armar binds ner och nya skott växer upp varje år.", "w": ["En metod där rankan växer fritt som en liten buske utan stöd.", "En metod där rankan leds längs en pergola över huvudhöjd.", "En metod där flera korta spurar sparas runt stammen på ett cordon."]}, {"q": "Vad är \"gobelet\" för beskärningsmetod?", "a": "En metod där flera grenar sparas och får växa fritt utan trådar, vanligt i varma klimat.", "w": ["En metod där en lång arm leds uppåt längs en pergola.", "En metod där rankan odlas på ett enda högt stöd av stål och binds i toppen.", "En metod där stammen delas i två symmetriska armar längs trådar, så kallad dubbel cordon."]}, {"q": "Vad är skillnaden mellan manuell och maskinell skörd?", "a": "Manuell skörd är varsam och möjliggör sortering, men är dyrare och långsammare. Maskinell skörd är snabb och billig men mindre selektiv.", "w": ["Manuell skörd görs med skakmaskiner, maskinell skörd görs med sax och kniv.", "Manuell skörd ger lägre kvalitet men är mer miljövänlig, maskinell skörd är dyrare men mer exakt.", "Manuell skörd görs enbart nattetid, maskinell skörd kan ske dygnet runt."]}, {"q": "Vad är \"appassimento\"?", "a": "En metod där druvor torkas före vinframställning för att koncentrera smak och socker.", "w": ["En metod där druvor fryses före pressning för att koncentrera sötman.", "En metod där muster värms upp för att starta jäsningen snabbare.", "En metod där vinet lagras i fat med torkade druvskal för mer struktur."]}, {"q": "Vad är malolaktisk jäsning?", "a": "En process där äppelsyra omvandlas till mjölksyra, vilket gör vinet mjukare.", "w": ["En process där mjölksyra omvandlas till äppelsyra, vilket ger vinet mer friskhet.", "En andra alkoholjäsning som ger vinet kolsyra på flaska.", "En process där vinsyra fälls ut som kristaller och gör vinet klarare."]}, {"q": "Vilken funktion har svavel i vinframställning?", "a": "Det används som antioxidant och antiseptiskt medel för att skydda vinet.", "w": ["Det används för att höja vinets alkoholhalt och förbättra färgen.", "Det används för att ge vinet mer kropp och krämig struktur.", "Det används för att stoppa mjölksyrajäsning och bevara all sötma."]}, {"q": "Vad är \"chaptalisering\"?", "a": "Tillsats av socker till musten för att höja alkoholhalten.", "w": ["Tillsats av vinsyra till musten för att höja syran.", "Tillsats av jäst efter första jäsningen för att öka alkoholen.", "Tillsats av vatten till musten för att sänka en alltför hög sockerhalt."]}, {"q": "Vad är skillnaden mellan vitt och rött vin i tillverkningsprocessen?", "a": "Vitt vin pressas före jäsning, rött vin jäser med skal och pressas efter jäsning.", "w": ["Vitt vin jäser med skalen och pressas efter jäsning, rött vin pressas före jäsning.", "Vitt vin görs enbart av gröna druvor och rött enbart av druvor odlade i varma klimat.", "Vitt vin jäser alltid på ekfat, medan rött vin jäser på stålkar."]}, {"q": "Vad är \"sur lie\"?", "a": "Lagring av vin på jästfällningen för att ge mer komplexitet och krämighet.", "w": ["Lagring av vin i fat som gjorts av ek från samma område som druvorna.", "Filtrering av vinet genom jästfällning för att få en klar och ren smak.", "En metod där druvklasarna hängs upp och torkas innan pressning."]}, {"q": "Vilka är de vanligaste svampsjukdomarna i vingården?", "a": "Mjöldagg (oidium) och bladmögel (mildiou).", "w": ["Pärlemorrost och gråröta.", "Svartröta och stjälkförtorkning.", "Vinlus och mjölsvamp."]}, {"q": "Vad är \"biodynamisk odling\"?", "a": "En odlingsmetod med strängare regler än ekologisk odling, där vingården ses som ett eget kretslopp och man använder homeopatiska preparat.", "w": ["En odlingsmetod där man helt undviker bevattning och beskärning.", "En odlingsmetod som använder konstgödsel i små doser enligt månens faser.", "En odlingsmetod där vinet jäser spontant och lagras i lerkrukor nedgrävda i jorden."]}, {"q": "Vad är \"mustvikt\"?", "a": "Ett mått på druvmustens densitet och därmed sockerhalt.", "w": ["Ett mått på mängden syra i musten och därmed vinets friskhet.", "Ett mått på druvans skalstjocklek och därmed tanninmängden.", "Ett mått på mängden jäst som behövs för att starta jäsningen."]}, {"q": "Vad är \"assemblage\"?", "a": "Att blanda olika viner, druvsorter eller årgångar för att skapa önskad smakprofil.", "w": ["Att filtrera vin före buteljering för att avlägsna jäst.", "Att välja ut de bästa druvorna från olika vingårdar vid skörd.", "Att lagra samma vin i olika fattyper och sedan välja det bästa."]}, {"q": "Vilka faktorer påverkar vinrankans rotsystem?", "a": "Rotstock, klimat och jordmån.", "w": ["Rotstock, ålder och skördemetod.", "Beskärning, planteringsår och svavelanvändning.", "Jästtyp, jordens pH och druvans färg."]}, {"q": "Vad är \"klimat\" i vinsammanhang?", "a": "Medelvärdet av vädret under minst 30 år i ett område.", "w": ["Vädret under en enskild säsong i ett vinområde.", "Den lokala temperaturen i vingården vid en viss tidpunkt på dygnet.", "Den mikroklimatiska skillnaden mellan två rader i samma vingård."]}, {"q": "Vad är \"véraison\"?", "a": "Den period då druvorna ändrar färg och börjar mogna.", "w": ["Den period då druvorna blommar och bär sätter sig.", "Den period då druvorna når sin maximala sockerhalt strax före skörd.", "Den period då rankan går i vila under vintern."]}, {"q": "Vad är \"pomace\"?", "a": "Pressrester av skal och kärnor efter vinframställning.", "w": ["Den vätska som blir kvar efter pressning och som används till sprit.", "Jästfällningen som samlas i botten av tanken efter jäsning.", "Ett slags filter som används för att klara vinet."]}, {"q": "Vad är \"PIWI-druvor\"?", "a": "Hybriddruvor som är resistenta mot svampsjukdomar.", "w": ["Druvor som odlas på mycket hög höjd och därför mognar långsamt.", "Druvor som är genmodifierade för att ge högre skörd.", "Druvor som är förädlade för att ge extra hög sockerhalt i kalla klimat."]}, {"q": "Vad är \"klarning\" av vin?", "a": "Processen att avlägsna olösliga partiklar för att göra vinet klart.", "w": ["Att tillsätta jäst för att få vinet att jäsa färdigt.", "Att blanda vinet med kolsyra för att göra det mousserande.", "Att sänka alkoholhalten genom att avlägsna en del av vätskan."]}, {"q": "Vilka är de vanligaste förslutningarna för vinflaskor?", "a": "Naturkork, plastkork, skruvkapsyl och glaspropp.", "w": ["Naturkork, trälock, aluminiumfolie och vaxförsegling.", "Skruvkapsyl, gummipropp, plastfilm och pappkork.", "Naturkork, vaxkapsyl, metallkapsyl och kartongpropp."]}, {"q": "Vad är den vanligaste orsaken till korkskada på vin?", "a": "Angrepp av mögelsvamp på korken som bildar TCA (trikloranisol).", "w": ["Syrebrist i flaskan som får vinet att bli sött och sirapigt.", "Överdriven svavling som oxiderar korken och missfärgar vinet.", "Hög luftfuktighet i vinkällaren som får korken att sväva ut."]}]}, {"n": 2, "t": "Bordeaux och Loire", "items": [{"q": "Vilken druva dominerar på den högra stranden i Bordeaux?", "a": "Merlot.", "w": ["Cabernet sauvignon.", "Cabernet franc.", "Petit verdot."]}, {"q": "Vad kallas de ekfat som oftast används i Bordeaux och hur mycket rymmer de?", "a": "Barrique, 225 liter.", "w": ["Pièce, 228 liter.", "Barrique, 300 liter.", "Foudre, 1 000 liter."]}, {"q": "Vilket år klassificerades Bordeauxvinerna vid världsutställningen i Paris?", "a": "1855.", "w": ["1789.", "1900.", "1936."]}, {"q": "Vilka är de fem Premier Cru-slotten enligt 1855 års klassificering?", "a": "Château Haut-Brion, Château Latour, Château Margaux, Château Lafite, Château Mouton-Rothschild (från 1973).", "w": ["Château Haut-Brion, Château Latour, Château Margaux, Château Cheval Blanc, Château Pétrus.", "Château Latour, Château Margaux, Château Lafite, Château d'Yquem, Château Ausone.", "Château Léoville-Las Cases, Château Latour, Château Margaux, Château Lafite, Château Palmer."]}, {"q": "Vilken är den mest odlade gröna druvan i Bordeaux?", "a": "Sémillon.", "w": ["Sauvignon blanc.", "Muscadelle.", "Ugni blanc."]}, {"q": "Vad innebär AOP i fransk vinlagstiftning?", "a": "Appellation d'Origine Protégée – den högsta klassen som garanterar geografiskt ursprung, druvsorter, skördeuttag, alkoholhalt och produktionsmetoder.", "w": ["Appellation d'Origine Protégée – en lägre klass för enklare bordsviner utan krav på ursprung.", "Appellation d'Origine Privée – en klass som ägarna av ett vinhus själva kan certifiera.", "Association des Origines Prestigieuses – ett kvalitetsmärke som delas ut av vinhandlare."]}, {"q": "Vilken klimattyp har Bordeaux?", "a": "Milt havsklimat, påverkat av Atlanten och Girondeviken.", "w": ["Kallt kontinentalt klimat med långa vintrar och korta somrar.", "Medelhavsklimat med torra, heta somrar och milda vintrar.", "Bergsklimat med stora temperaturskillnader mellan dag och natt."]}, {"q": "Vilken druva dominerar de röda vinerna på den vänstra stranden?", "a": "Cabernet sauvignon.", "w": ["Merlot.", "Cabernet franc.", "Malbec."]}, {"q": "Vad är särskilt med Château d'Yquem i Sauternes?", "a": "Det har en egen klassificering: 1er Cru Supérieur.", "w": ["Det är den enda slottet i Bordeaux som får göra både rött och vitt vin.", "Det klassades som Premier Cru Classé tillsammans med Château Latour.", "Det är det äldsta slottet i Sauternes och har därför ingen klassificering."]}, {"q": "Vilka är de tre klasserna för franska viner efter 2009?", "a": "AOP, IGP och Vin de France.", "w": ["AOP, IGP och Vin de Table.", "Grand Cru, Premier Cru och Vin de Pays.", "AOC, VDQS och Vin de France."]}, {"q": "Vilken är den största appellationen för kvalitetsvin i Frankrike?", "a": "Bordeaux.", "w": ["Languedoc.", "Côtes du Rhône.", "Champagne."]}, {"q": "Vad är Guyot-systemet?", "a": "Ett system för uppbindning av vinrankor som ofta används i Bordeaux.", "w": ["En beskärningsmetod som lämnar flera grenar att växa fritt som en buske.", "En sorts ekfat som används vid lagring av söta viner.", "En klassificering av vingårdar efter jordmånens kvalitet."]}, {"q": "Vilka är de sex kommunappellationerna i Haut-Médoc?", "a": "St-Estèphe, Pauillac, St-Julien, Margaux, Listrac, Moulis.", "w": ["St-Estèphe, Pauillac, St-Julien, Margaux, Pessac och Graves.", "Pomerol, St-Émilion, Pauillac, Margaux, Listrac och Moulis.", "St-Estèphe, Pauillac, St-Julien, Margaux, Fronsac och Moulis."]}, {"q": "Vilken druva är karaktärsdruvan i de ädelsöta vinerna från Sauternes?", "a": "Sémillon.", "w": ["Sauvignon blanc.", "Muscadelle.", "Chenin blanc."]}, {"q": "Vad kallas de röda vinerna från Bordeaux som engelsmännen importerade under medeltiden?", "a": "Claret.", "w": ["Burgundy.", "Vin gris.", "Rouge anglais."]}, {"q": "Vilken är Frankrikes längsta flod och hur lång är den?", "a": "Loire, cirka 1 012 km lång.", "w": ["Seine, cirka 777 km lång.", "Rhône, cirka 813 km lång.", "Garonne, cirka 575 km lång."]}, {"q": "Vilken är den mest odlade blå druvan i Loire och var kommer den bäst till sin rätt?", "a": "Cabernet franc, särskilt i Chinon och Bourgueil.", "w": ["Gamay, särskilt i Saumur-Champigny.", "Pinot noir, särskilt i Sancerre.", "Grolleau, särskilt i Anjou."]}, {"q": "Vilka är de tre största vintyperna i Loire sett till produktion?", "a": "Vitt vin (42 %), rosé (25 %) och rött vin (18 %), samt mousserande (15 %).", "w": ["Vitt vin (15 %), rosé (42 %), rött vin (25 %) och mousserande (18 %).", "Rött vin (50 %), vitt vin (30 %), rosé (15 %) och mousserande (5 %).", "Vitt vin (60 %), rött vin (30 %) och rosé (10 %), utan mousserande."]}, {"q": "Vad innebär begreppen AOC och AOP?", "a": "AOC är Frankrikes klassificering (Appellation d’Origine Contrôlée), AOP är EU:s klassificering (Appellation d’Origine Protégée).", "w": ["AOC är EU:s klassificering, AOP är Frankrikes nationella klassificering.", "AOC gäller enbart vita viner och AOP enbart röda viner.", "AOC är en äldre beteckning för bordsvin, AOP är den högsta kvalitetsklassen."]}, {"q": "Vilka är de viktigaste gröna druvorna i Loire?", "a": "Chenin blanc (pineau de la Loire), sauvignon blanc och melon (muscadet).", "w": ["Sauvignon blanc, pinot gris och gros plant.", "Chardonnay, aligoté och melon de Bourgogne.", "Viognier, grenache blanc och sacy."]}, {"q": "Vilken jordmån dominerar i västra Anjou?", "a": "Gammal granit, basalt och skiffer.", "w": ["Kalksten, krita och kimmeridgelera.", "Lerig kalkjord med inslag av flinta.", "Sand och grus avlagrat av floden."]}, {"q": "Vad kännetecknar klimatet i Pays Nantais och Anjou-Saumur?", "a": "Milt, fuktigt och maritimt klimat.", "w": ["Kallt, torrt och kontinentalt klimat.", "Varmt medelhavsklimat med torra somrar.", "Alpint klimat med korta, svala somrar."]}, {"q": "Vilken är den största appellationen i Pays Nantais och vilken druva dominerar där?", "a": "Muscadet-Sèvre-et-Maine, druvan är melon (muscadet).", "w": ["Sancerre, druvan är sauvignon blanc.", "Vouvray, druvan är chenin blanc.", "Muscadet Côtes de Grandlieu, druvan är folle blanche."]}, {"q": "Vad innebär \"sur lie\" i samband med muscadet-viner?", "a": "Att vinet får vila på jästfällningen efter jäsning, vilket ger friskhet och en lätt spritsighet", "w": ["Att vinet jäser på ekfat för att få vaniljton och rundare smak.", "Att vinet filtreras genom jästfällning för att bli klarare.", "Att druvorna skördas sent så att de angrips av ädelmögel."]}, {"q": "Vilka är de fyra viktigaste \"grands crus\" i Anjou?", "a": "Bonnezeaux, Quarts de Chaume (söta viner), Coulée de Serrant och Savennières Roche aux Moines (torra viner)", "w": ["Savennières, Vouvray, Montlouis och Coteaux du Layon.", "Sancerre, Pouilly-Fumé, Quincy och Reuilly.", "Bonnezeaux, Quarts de Chaume, Vouvray och Montlouis."]}, {"q": "Vilken druva används för de mest lagringsdugliga torra vita vinerna i Savennières?", "a": "Chenin blanc.", "w": ["Sauvignon blanc.", "Melon de Bourgogne.", "Chardonnay."]}, {"q": "Vilka är de mest kända rödvinsappellationerna i Touraine?", "a": "Chinon, Bourgueil och Saint-Nicolas-de-Bourgueil.", "w": ["Sancerre, Menetou-Salon och Quincy.", "Saumur-Champigny, Anjou och Coteaux du Layon.", "Chinon, Muscadet och Pouilly-sur-Loire."]}, {"q": "Vilken druva dominerar de vita vinerna från Sancerre och Pouilly-Fumé i Övre Loire?", "a": "Sauvignon blanc.", "w": ["Chenin blanc.", "Melon de Bourgogne.", "Pinot gris."]}, {"q": "Vilken unik grön druva får endast användas i AOP Saint-Pourçain?", "a": "Sacy (tressallier).", "w": ["Gros plant.", "Romorantin.", "Grolleau gris."]}, {"q": "Vad är särskilt med jordmånen i Sancerre och Pouilly-Fumé?", "a": "Den består av kalksten, flinta (silex), krita och kimmeridgelera, vilket ger vinerna mineralitet och komplexitet.", "w": ["Den består av granit och skiffer, vilket ger vinerna värme och fyllighet.", "Den består av sand och grus från floden, vilket ger lätta och fruktiga viner.", "Den består av vulkanisk lava och basalt, vilket ger vinerna rökighet och kraft."]}]}, {"n": 3, "t": "Alsace och Bourgogne", "items": [{"q": "Var ligger vinregionen Alsace?", "a": "I nordöstra Frankrike, vid gränsen mot Tyskland, mellan Vogeserna och floden Rhen.", "w": ["I sydvästra Frankrike, vid gränsen mot Spanien, mellan Pyrenéerna och Atlanten.", "I östra Frankrike, mellan Jurabergen och floden Saône.", "I norra Frankrike, vid gränsen mot Belgien, mellan Ardennerna och Marne."]}, {"q": "Vilka är de två administrativa områdena i Alsace?", "a": "Bas-Rhin (norra delen) och Haut-Rhin (södra delen).", "w": ["Haute-Marne (norra delen) och Marne (södra delen).", "Moselle (västra delen) och Vosges (östra delen).", "Bas-Rhin (södra delen) och Territoire de Belfort (norra delen)."]}, {"q": "Vilka är de tre huvudsakliga ursprungsbeteckningarna (AOP) i Alsace?", "a": "AOP Vin d’Alsace, AOP Alsace Grand Cru och AOP Crémant d’Alsace.", "w": ["AOP Alsace, AOP Alsace Premier Cru och AOP Crémant de Bourgogne.", "AOP Vin d’Alsace, AOP Alsace Grand Cru och AOP Alsace Vendange Tardive.", "AOP Alsace Villages, AOP Alsace Grand Cru och AOP Alsace Gewurztraminer."]}, {"q": "Vilken typ av vin dominerar produktionen i Alsace?", "a": "Vitt vin, cirka 90 % av produktionen.", "w": ["Rött vin, cirka 60 % av produktionen.", "Rosévin, cirka 40 % av produktionen.", "Mousserande vin, cirka 70 % av produktionen."]}, {"q": "Vilka fyra druvsorter räknas som \"ädla druvor\" i Alsace Grand Cru?", "a": "Riesling, Pinot gris, Gewurztraminer och Muscat.", "w": ["Riesling, Pinot blanc, Sylvaner och Muscat.", "Riesling, Pinot gris, Auxerrois och Gewurztraminer.", "Pinot noir, Pinot gris, Gewurztraminer och Riesling."]}, {"q": "Vad är Edelzwicker?", "a": "Ett blandvin från Alsace som kan bestå av flera olika druvsorter (ej chardonnay).", "w": ["Ett sött vin från Alsace gjort på ädelrötade druvor.", "Ett mousserande vin från Alsace som görs enbart på riesling.", "Ett blandvin från Alsace som alltid innehåller minst 50 % chardonnay."]}, {"q": "Vad innebär Vendange Tardive?", "a": "Sen skörd, ett sött vin gjort på ädla druvor, motsvarande tyska Auslese.", "w": ["Vin som jäser på ekfat i minst tre år, motsvarande tyska Spätlese.", "Torrt vin gjort på tidigt skördade druvor, motsvarande tyska Kabinett.", "Ett vin från druvor som torkats på halm, motsvarande italienska passito."]}, {"q": "Vilken roll spelar Vogeserna för klimatet i Alsace?", "a": "De skyddar vingårdarna från kalla och fuktiga västvindar, vilket ger ett torrt och soligt klimat.", "w": ["De fångar upp regnet från väst men skapar ett kallt, fuktigt klimat med dimma.", "De släpper in varma sydvindar som gör klimatet subtropiskt.", "De skyddar vingårdarna mot nordliga stormar och ger ett milt havsklimat."]}, {"q": "Vad är Crémant d’Alsace?", "a": "Ett mousserande vin från Alsace, tillverkat enligt méthode traditionelle.", "w": ["Ett stilla vin från Alsace som lagras på ek i minst två år.", "Ett mousserande vin från Alsace gjort enligt tankmetoden.", "Ett starkvin från Alsace där jäsningen avbryts med sprit."]}, {"q": "Vilken druva får endast användas i Crémant d’Alsace rosé?", "a": "Pinot noir.", "w": ["Pinot gris.", "Gamay.", "Pinot meunier."]}, {"q": "Vad är speciellt med flaskan \"la flûte\"?", "a": "Det är den långsmala, namnskyddade flaskan som används för AOP Alsace-viner.", "w": ["Den är en kort, bred flaska som används för alla vitt vin från Frankrike.", "Den är en stor flaska på tre liter som används för Grand Cru-viner.", "Den är en mörk flaska med platt axel som enbart används för rött vin."]}, {"q": "Vilka är de viktigaste jordmånerna i Alsace?", "a": "Granit, skiffer, sandsten, kalksten, märgel och jordar från istidens smältvatten.", "w": ["Basalt, lava, kalksten och lössjord.", "Kritjord, flinta och kimmeridgelera.", "Sand, grus och rullstenar från Rhen."]}, {"q": "Vad innebär det att ett vin är märkt med \"lieu-dit\"?", "a": "Det kommer från en specifik vingård eller fält med eget namn och har strängare regelverk.", "w": ["Det är ett vin som blandats från flera vingårdar inom samma kommun.", "Det är ett vin som lagrats minst tio år före försäljning.", "Det är ett vin som är gjort av druvor från icke-klassade lägen."]}, {"q": "Vilka är de två typerna av söta viner i Alsace?", "a": "Vendange Tardive och Sélection de Grains Nobles (SGN).", "w": ["Vendange Tardive och Vin de Paille.", "Sélection de Grains Nobles och Crémant doux.", "Vin jaune och Vendange Tardive."]}, {"q": "Vilka är de tre huvudsakliga aktörerna i vinproduktionen i Alsace?", "a": "Oberoende vinodlare (20 %), kooperativ (40 %) och negocianter (40 %).", "w": ["Oberoende vinodlare (40 %), kooperativ (20 %) och negocianter (40 %).", "Oberoende vinodlare (60 %), kooperativ (10 %) och negocianter (30 %).", "Oberoende vinodlare (30 %), kooperativ (50 %) och negocianter (20 %)."]}, {"q": "Vilka departement omfattar Bourgogne och Beaujolais enligt Munskänkarna?", "a": "Yonne, Côte d’Or, Saône-et-Loire och Rhône.", "w": ["Aube, Marne, Haute-Marne och Rhône.", "Yonne, Jura, Ain och Isère.", "Côte d’Or, Saône-et-Loire, Loire och Allier."]}, {"q": "Vilken är den mest odlade druvan i Beaujolais?", "a": "Gamay.", "w": ["Pinot noir.", "Syrah.", "Aligoté."]}, {"q": "Vad innebär begreppet \"terroir\" i Bourgogne?", "a": "Terroir syftar på vingårdens kvalitet, inklusive jordmån, dränering, solexponering och vindskydd.", "w": ["Terroir syftar på vinmakarens skicklighet och de tekniker som används i källaren.", "Terroir syftar på druvans sockerhalt och mognadsgrad vid skörd.", "Terroir syftar på ekfatens ursprung och hur länge vinet lagras."]}, {"q": "Vilken historisk roll hade munkarna i Bourgognes vinodling?", "a": "Munkarna utvecklade vinodlingen genom att experimentera, föra journaler och klassificera olika växtplatser.", "w": ["Munkarna införde ekfat och mousserande vin i regionen.", "Munkarna planterade endast gamay och drev vinodlingen i hemlighet.", "Munkarna förbjöd vinodling på sluttningar och flyttade den till slätten."]}, {"q": "Vad är Clos de Vougeot känt för?", "a": "Clos de Vougeot är en berömd muromgärdad Grand Cru-vingård med många ägare.", "w": ["Clos de Vougeot är en liten vingård som ägs av en enda familj och gör enbart vitt vin.", "Clos de Vougeot är en klassificering för Premier Cru-viner från Chablis.", "Clos de Vougeot är ett kooperativ som tillverkar Crémant de Bourgogne."]}, {"q": "Vilka är de tre huvudsakliga appellationsnivåerna i Bourgogne?", "a": "Grand Cru, kommunal och regional appellation.", "w": ["Premier Cru, kommunal och Grand Cru-appellation.", "Grand Cru, Premier Cru och Vin de Pays.", "Regional, lokal och Grand Vin."]}, {"q": "Vilken är den enda tillåtna druvsorten för Chablis?", "a": "Chardonnay.", "w": ["Aligoté.", "Pinot blanc.", "Sauvignon blanc."]}, {"q": "Vad är chaptalisering och varför används det?", "a": "Chaptalisering är tillsats av socker till musten för att höja alkoholhalten när druvorna inte mognat tillräckligt.", "w": ["Chaptalisering är tillsats av vinsyra till musten för att sänka pH.", "Chaptalisering är avlägsnande av alkohol för att få ett lättare vin.", "Chaptalisering är en filtrering som görs före buteljering."]}, {"q": "Nämn två skillnader mellan Bourgogne och Bordeaux vad gäller druvsorter.", "a": "Bourgogne har främst pinot noir och chardonnay, Bordeaux har flera röda och vita druvsorter som cabernet sauvignon, merlot och sauvignon blanc.", "w": ["Bourgogne har främst gamay och aligoté, Bordeaux har enbart cabernet sauvignon och sémillon.", "Bourgogne har pinot noir och sauvignon blanc, Bordeaux har syrah och viognier.", "Bourgogne har chenin blanc och cabernet franc, Bordeaux har pinot noir och chardonnay."]}, {"q": "Vilka är de sju Grand Cru-lägena i Chablis?", "a": "Blanchot, Bougros, Les Clos, Grenouilles, Preuses, Valmur och Vaudésir (La Moutonne räknas ibland som åttonde).", "w": ["Montée de Tonnerre, Fourchaume, Vaillons, Mont de Milieu, Beauroy, Côte de Léchet och Vau Ligneau.", "Chablis, Petit Chablis, Fourchaume, Les Clos, Valmur, Preuses och Grenouilles.", "Blanchot, Bougros, Les Clos, Grenouilles, Preuses, Valmur och Montrachet."]}, {"q": "Vad kännetecknar viner från Côte de Nuits?", "a": "Nästan bara röda viner på pinot noir, ofta eleganta, kraftfulla och lagringsdugliga.", "w": ["Främst vita viner på chardonnay, ofta lätta och avsedda att drickas unga.", "Främst röda viner på gamay, ofta fruktiga och lätta.", "Främst mousserande viner på pinot noir och chardonnay."]}, {"q": "Vilken by i Côte de Beaune producerar mest vita viner?", "a": "Meursault.", "w": ["Puligny-Montrachet.", "Aloxe-Corton.", "Pommard."]}, {"q": "Vad är Beaujolais Nouveau och när släpps det?", "a": "Ett ungt vin gjort på årets skörd, släpps tredje torsdagen i november.", "w": ["Ett lagrat vin från gamay som släpps första måndagen i januari.", "Ett sött vin från Beaujolais som släpps andra torsdagen i oktober.", "Ett mousserande vin från Beaujolais som släpps varje midsommar."]}, {"q": "Vilken jordmån anses bäst för Chablis Grand Cru?", "a": "Kimmeridge-jord.", "w": ["Kalkjord med mycket sand.", "Granit och skiffer.", "Lerjord med inslag av basalt."]}, {"q": "Vad är skillnaden mellan AOC och AOP?", "a": "AOC är den franska klassificeringen, AOP är EU:s beteckning.", "w": ["AOC är EU:s beteckning, AOP är den franska klassificeringen.", "AOC gäller enbart röda viner, AOP gäller enbart vita viner.", "AOC är en lägre klass än AOP och gäller bordsvin."]}]}, {"n": 4, "t": "Övr. Frankrike och Rhone", "items": [{"q": "Vilken vinregion i Frankrike står för cirka en fjärdedel av landets vinproduktion och har minskat sin areal med 20 % under 1900-talets första decennier?", "a": "Languedoc-Roussillon är regionen som står för cirka en fjärdedel av Frankrikes vinproduktion och har minskat sin areal med 20 % under 1900-talets första decennier.", "w": ["Bordeaux är regionen som står för cirka en fjärdedel av Frankrikes vinproduktion.", "Rhônedalen är regionen som står för cirka en fjärdedel av Frankrikes produktion och har ökat sin areal kraftigt.", "Provence är regionen som står för cirka en fjärdedel av Frankrikes produktion och har minskat sin areal med 20 %."]}, {"q": "Vilken typ av klimat råder i Languedoc och Roussillon, och vad kännetecknar deras jordmån?", "a": "Medelhavsklimat råder, med torra heta somrar och milda vintrar. Jordmånen domineras av grus- och skifferjordar på kalkstensgrund i Languedoc och varierande jordar i Roussillon.", "w": ["Kontinentalt klimat med kalla vintrar, och jordmånen är främst lera och kritjord.", "Maritimt klimat med mycket regn, och jordmånen är främst granit och skiffer.", "Alpint klimat med korta somrar, och jordmånen är främst vulkanisk basalt."]}, {"q": "Vad är Vin doux naturel (VDN) och i vilken region produceras cirka 80 % av Frankrikes VDN-viner?", "a": "Vin doux naturel (VDN) är ett starkvin där jäsningen avbryts med vinsprit vid 5–6 % alkohol. Cirka 80 % av Frankrikes VDN-viner produceras i Roussillon.", "w": ["VDN är ett mousserande vin där jäsningen avbryts med kolsyra. Cirka 80 % produceras i Languedoc.", "VDN är ett torkat druvvin av passerillage. Cirka 80 % produceras på Korsika.", "VDN är ett starkvin som lagras i fat i 20 år. Cirka 80 % produceras i Provence."]}, {"q": "Vilka är de viktigaste blå druvsorterna i Languedoc?", "a": "Syrah, grenache, mourvèdre, carignan och merlot är de viktigaste blå druvsorterna i Languedoc.", "w": ["Pinot noir, gamay, cabernet franc och tannat.", "Sangiovese, nebbiolo, grenache och barbera.", "Cabernet sauvignon, malbec, syrah och petit verdot."]}, {"q": "Vilken druvsort är karaktärsdruvan i Bandol i Provence?", "a": "Mourvèdre är karaktärsdruvan i Bandol.", "w": ["Grenache.", "Cinsault.", "Syrah."]}, {"q": "Vilken vintyp dominerar i Provence och hur stor andel av regionens produktion utgör den?", "a": "Rosévin dominerar i Provence och utgör cirka 86–90 % av regionens produktion.", "w": ["Vitt vin dominerar i Provence och utgör cirka 60 % av produktionen.", "Rödvin dominerar i Provence och utgör cirka 70 % av produktionen.", "Mousserande vin dominerar i Provence och utgör cirka 50 % av produktionen."]}, {"q": "Vad innebär passerillage och i vilken fransk vinregion används denna metod för att framställa söta viner?", "a": "Passerillage innebär att druvor torkas för att öka sockerhalten och koncentrationen. Metoden används bland annat i Jurançon i Sydväst.", "w": ["Passerillage innebär att druvorna skördas frusna. Metoden används bland annat i Alsace.", "Passerillage innebär att druvor angrips av ädelmögel. Metoden används bland annat i Sauternes.", "Passerillage innebär att musten kokas ned. Metoden används bland annat i Champagne."]}, {"q": "Vilken blå druvsort är mest betydelsefull i Cahors och måste ingå till minst 70 % i vinerna där?", "a": "Malbec är den mest betydelsefulla blå druvsorten i Cahors och måste ingå till minst 70 %.", "w": ["Tannat är den mest betydelsefulla druvan i Cahors och måste ingå till minst 70 %.", "Merlot är den mest betydelsefulla druvan i Cahors och måste ingå till minst 50 %.", "Cabernet franc är den mest betydelsefulla druvan i Cahors och måste ingå till minst 80 %."]}, {"q": "Vilken är den dominerande gröna druvsorten i Jura och vilken speciell vintyp görs på denna druva?", "a": "Chardonnay är den dominerande gröna druvsorten i Jura. Vin jaune görs dock på savagnin.", "w": ["Savagnin är den dominerande gröna druvan i Jura. Vin jaune görs dock på chardonnay.", "Sauvignon blanc är den dominerande gröna druvan i Jura. Vin jaune görs på poulsard.", "Chardonnay är dominerande i Jura. Vin jaune görs på trousseau."]}, {"q": "Vad är vin jaune och hur framställs det?", "a": "Vin jaune är ett vin gjort på savagnin som lagras minst 6 år och 3 månader på fat utan påfyllning, där ett jästtäcke (voile) bildas och ger vinet dess speciella smak.", "w": ["Vin jaune är ett vin gjort på chardonnay som lagras 12 månader på stålfat med regelbunden påfyllning.", "Vin jaune är ett sött vin av torkade savagnindruvor som lagras 3 år i flaska.", "Vin jaune är ett mousserande vin där jästfällningen lämnas kvar i 6 år."]}, {"q": "Vilken är Savojens vanligaste gröna druvsort och vilken typ av vin ger den?", "a": "Jacquère är Savojens vanligaste gröna druvsort och ger lätta, friska vita viner.", "w": ["Altesse är Savojens vanligaste druva och ger tunga, ekade vita viner.", "Chardonnay är Savojens vanligaste druva och ger fylliga, söta viner.", "Mondeuse är Savojens vanligaste druva och ger kraftiga röda viner."]}, {"q": "Vilken är den största blå druvsorten på Korsika och i vilket AOP-område odlas den mest?", "a": "Niellucciu är den största blå druvsorten på Korsika och odlas mest i AOP Patrimonio.", "w": ["Sciacarello är den största blå druvan på Korsika och odlas mest i AOP Ajaccio.", "Vermentino är den största druvan på Korsika och odlas mest i AOP Patrimonio.", "Grenache är den största blå druvan på Korsika och odlas mest i AOP Calvi."]}, {"q": "Vad är typiskt för klimatet och jordmånen på Korsika?", "a": "Klimatet på Korsika är huvudsakligen varmt och torrt med starka vindar. Jordmånen varierar, men skiffer dominerar i norr och granit i väst och syd.", "w": ["Klimatet är kallt och regnigt med dimma. Jordmånen domineras av kalksten överallt.", "Klimatet är milt och maritimt. Jordmånen domineras av lera och sand.", "Klimatet är kontinentalt med kalla vintrar. Jordmånen domineras av vulkanisk lava."]}, {"q": "Vilken är den största appellationen i Provence och vilken vintyp dominerar där?", "a": "Côtes de Provence är den största appellationen i Provence och rosévin dominerar där.", "w": ["Languedoc-Roussillon är den största appellationen i Provence och vitt vin dominerar.", "Bandol är den största appellationen i Provence och rött vin dominerar.", "Côtes de Provence är den största appellationen i Provence och mousserande vin dominerar."]}, {"q": "Vad är Macvin du Jura och hur framställs det?", "a": "Macvin ": ["Gigondas.", "Lirac.", "Cornas."]}, {"q": "Vad står förkortningen GSM för i Rhône-sammanhang?", "a": "GSM står för Grenache, Syrah och Mourvèdre – de tre huvuddruvorna i många röda Rhôneblandningar.", "w": ["GSM står för Grenache, Syrah och Marsanne – tre druvor i vita Rhôneviner.", "GSM står för Gigondas, Saint-Joseph och Mourvèdre – de tre appellationerna i södra Rhône.", "GSM står för Grenache, Sauvignon och Merlot – de tre druvorna i Languedoc."]}, {"q": "Vilken är den största appellationen i norra Rhône?", "a": "Crozes-Hermitage.", "w": ["Hermitage.", "Condrieu.", "Saint-Joseph."]}, {"q": "Vilken historisk person låg bakom skapandet av AOC-systemet i Frankrike?", "a": "Baron Le Roy från Châteauneuf-du-Pape.", "w": ["Marquis de Lur-Saluces från Sauternes.", "Louis Pasteur från Arbois i Jura.", "Baron Philippe de Rothschild från Pauillac."]}, {"q": "Vilka tre gröna druvor används för vita viner i norra Rhône?", "a": "Viognier, marsanne och roussanne.", "w": ["Chardonnay, roussanne och clairette.", "Viognier, grenache blanc och bourboulenc.", "Marsanne, ugni blanc och picpoul."]}, {"q": "Vad är speciellt med vinproduktionen i appellationen Côte-Rôtie?", "a": "I Côte-Rôtie får man blanda in upp till 20 % av den gröna druvan viognier i de röda vinerna, och blå och gröna druvor måste samjäsas.", "w": ["I Côte-Rôtie får man blanda in upp till 20 % syrah i de vita vinerna, och druvorna måste jäsas separat.", "I Côte-Rôtie är enbart syrah tillåten, och vinet måste lagras minst tio år.", "I Côte-Rôtie får man blanda in upp till 50 % grenache i vinet, och vinet görs enbart som rosé."]}, {"q": "Vilken är den dominerande druvan i Châteauneuf-du-Pape?", "a": "Grenache.", "w": ["Syrah.", "Mourvèdre.", "Cinsault."]}, {"q": "Hur stor andel av Rhônes vinproduktion är rött vin?", "a": "Cirka 75 % (2020).", "w": ["Cirka 45 % (2020).", "Cirka 90 % (2020).", "Cirka 60 % (2020)."]}, {"q": "Vad är \"mutage\" och i vilken vintyp används det?", "a": "Mutage är tillsats av sprit för området runt Neusiedlersee, är känt för ädelsöta viner.", "w": ["Wachau, särskilt området runt Dürnstein, är känt för ädelsöta viner.", "Steiermark, särskilt området runt Graz, är känt för ädelsöta viner.", "Weinviertel, särskilt området runt Retz, är känt för ädelsöta viner."]}, {"q": "Vad kännetecknar klimatet i Österrike och vilka vindar påverkar vinodlingen?", "a": "Österrike har inlandsklimat med varma somrar och kalla vintrar, påverkat av kalla vindar från norr, svala vindar från väst, samt varma vindar från öst och söder.", "w": ["Österrike har havsklimat med milda vintrar, påverkat av varma vindar från Atlanten.", "Österrike har alpint klimat med svala somrar, påverkat av torra nordvindar från Tyskland.", "Österrike har medelhavsklimat med heta somrar, påverkat av vindar från Adriatiska havet."]}, {"q": "Vad innebär \"Heurigen\" i österrikisk vinkultur?", "a": "Heurigen är vinstugor där vinodlarna själva serverar sitt vin, grundat på en förordning från kejsare Josef II år 1784.", "w": ["Heurigen är statliga vinmonopol som sålde vin enligt en förordning från kejsarinnan Maria Theresia år 1740.", "Heurigen är vinfester som arrangeras av kooperativen vid skörden, med rötter i 1500-talet.", "Heurigen är en kvalitetsklass för unga viner som släpps före 1 november."]}, {"q": "Vilken stad är världens enda huvudstad som också är ett eget vindistrikt?", "a": "Wien är världens enda huvudstad som också är ett eget vindistrikt.", "w": ["Salzburg är världens enda huvudstad som också är ett eget vindistrikt.", "Budapest är världens enda huvudstad som också är ett eget vindistrikt.", "Bratislava är världens enda huvudstad som också är ett eget vindistrikt."]}, {"q": "Vad är \"Strohwein\" eller \"Schilfwein\"?", "a": "Strohwein/Schilfwein är viner gjorda på druvor som torkats på halm- eller vassmattor för att koncentrera socker och smak.", "w": ["Strohwein är ett vin som lagrats på halm i lador för att få en nötig smak.", "Strohwein är viner gjorda på frusna druvor som skör 1850–1950.", "w": ["Riesling och sémillon användes främst till starkvin under ca 1850–1950.", "Cabernet sauvignon och merlot användes främst till starkvin under ca 1850–1950.", "Chardonnay och pinot noir användes främst till starkvin under ca 1850–1950."]}, {"q": "Vad kännetecknar Terra Rossajorden i Coonawarra och vilken druvsort trivs där?", "a": "Terra Rossajorden är en röd järnrik jord i Coonawarra, perfekt för cabernet sauvignon.", "w": ["Terra Rossajorden är en vit kalkjord i Coonawarra, perfekt för chardonnay.", "Terra Rossajorden är en svart vulkanjord i Coonawarra, perfekt för shiraz.", "Terra Rossajorden är en sandjord i Coonawarra, perfekt för riesling."]}, {"q": "Vilken viktig regel gäller enligt Label Integrity Program för vad som ska stå på etiketten?", "a": "Minst 85% av angiven druva, distrikt etc. måste ingå enligt etiketten.", "w": ["Minst 100 % av angiven druva måste ingå.", "Minst 75 % av angiven druva, distrikt etc. måste ingå.", "Minst 51 % av angiven druva, distrikt etc. måste ingå."]}, {"q": "Vad står förkortningen GI för och vad reglerar den?", "a": "GI står för Geographical Indications och reglerar ursprungsbeteckningar på olika nivåer (delstat, zon, region, delregion).", "w": ["GI står för Grape Index och reglerar sockerhalten i druvorna.", "GI står för General Inspection och reglerar kvaliteten på etiketter.", "GI står för Government Identification och reglerar vilka som får exportera."]}, {"q": "Nämn två klassiska vindistrikt i South Australia med varmt klimat.", "a": "Barossa Valley och McLaren Vale är klassiska vindistrikt med varmt klimat i South Australia.", "w": ["Yarra Valley och Mornington Peninsula är klassiska vindistrikt med varmt klimat i South Australia.", "Coonawarra och Clare Valley är klassiska vindistrikt med svalt klimat i South Australia.", "Margaret River och Swan Valley är klassiska vindistrikt med varmt klimat i South Australia."]}, {"q": "Vilka två druvsorter utgör nästan 50% av den totala arealen av blå druvor i Australien?", "a": "Shiraz och cabernet sauvignon utgör nästan 50% av den totala arealen av blå druvor.", "w": ["Shiraz och merlot utgör nästan 50 % av den totala arealen av blå druvor.", "Pinot noir och grenache utgör nästan 50 % av den totala arealen av blå druvor.", "Cabernet sauvignon och merlot utgör nästan 50 % av den totala arealen av blå druvor."]}, {"q": "Vilken grön druvsort har störst odlingsareal i Australien?", "a": "Chardonnay är den gröna druvsort som har störst odlingsareal i Australien.", "w": ["Sémillon är den gröna druvsort som har störst odlingsareal i Australien.", "Riesling är den gröna druvsort som har störst odlingsareal i Australien.", "Sauvignon blanc är den gröna druvsort som har störst odlingsareal i Australien."]}, {"q": "Vilken typ av viner är Tasmanien särskilt känt för?", "a": "Tasmanien är särskilt känt för mousserande viner med tydlig syra samt chardonnay och pinot noir.", "w": ["Tasmanien är särskilt känt för starkviner med låg syra samt shiraz och grenache.", "Tasmanien är särskilt känt för söta viner på ädelröta samt sémillon och riesling.", "Tasmanien är särskilt känt för kraftfulla rödviner med hög alkohol samt cabernet sauvignon."]}, {"q": "Hur beskrivs australiensiska chardonnayviner i dokumentet?", "a": "Australiensiska chardonnayviner är ofta fatig men blir mer och mer strama i europeisk stil.", "w": ["Australiensiska chardonnayviner är alltid helt utan fat och mycket aromatiska.", "Australiensiska chardonnayviner är alltid söta och fruktdrivna i amerikansk stil.", "Australiensiska chardonnayviner görs enbart som mousserande."]}, {"q": "Vilken analysmetod rekommenderas vid vinprovning enligt dokumentet?", "a": "Att alltid prova vin och göra anteckningar på samma sätt: färg, doft, smak, sötma, fruktsyra, fyllighet, strävhet, smaker, eftersmak och analys av vad vinet kan eller inte kan vara.", "w": ["Att bara dricka vin utan att anteckna för att inte påverkas av tidigare intryck.", "Att alltid jämföra vinet med ett referensvin från Frankrike och betygsätta med poäng.", "Att använda samma glas och mäta vinets pH och sockerhalt vid varje provning."]}, {"q": "Vad menas med att australiensiska viner ofta är \"tydliga i sin stil\"?", "a": "Att vinerna har tydliga, igenkännbara karaktärer och stilar, t.ex. fruktdrivna och kraftfulla röda viner eller strama vita viner.", "w": ["Att vinerna är neutrala i stilen och därför passar till alla maträtter.", "Att vinerna alltid är billiga och enkla att dricka unga.", "Att vinerna följer exakt samma stil som i Frankrike."]}, {"q": "Vilken druvsort är mest förknippad med Nya Zeelands vinproduktion?", "a": "Sauvignon blanc.", "w": ["Chardonnay.", "Pinot noir.", "Riesling."]}, {"q": "Vilket årtionde inleddes det stora vinlyftet i Nya Zeeland?", "a": "1970-talet.", "w": ["1950-talet.", "1990-talet.", "1930-talet."]}, {"q": "Vilken region står för cirka 90 % av all sauvignon blanc-odling i Nya Zeeland?", "a": "Marlborough.", "w": ["Hawkes Bay står för cirka 90 % av all sauvignon blanc-odling i Nya Zeeland.", "Central Otago står för cirka 90 % av all sauvignon blanc-odling i Nya Zeeland.", "Gisborne står för cirka 90 % av all sauvignon blanc-odling i Nya Zeeland."]}, {"q": "Vad kännetecknar klimatet i Nya Zeelands vinodlingsområden?", "a": "Maritimt klimat med svala nätter, mycket sol och skyddande bergskedjor.", "w": ["Kontinentalt klimat med heta somrar och kalla vintrar, utan skydd av berg.", "Subtropiskt klimat med mycket regn och heta nätter.", "Alpint klimat med snö under hela vintern och korta somrar."]}, {"q": "Vilken är den viktigaste blå druvan i Central Otago?", "a": "Pinot noir.", "w": ["Syrah.", "Merlot.", "Cabernet sauvignon."]}, {"q": "Vad innebär Certificate of New Zealand Origin?", "a": "Att vinet innehåller minst 85 % av den angivna druvsorten, kommer från angiven årgång och distrikt.", "w": ["Att vinet kommer från ekologiskt odlade druvor och är buteljerat i Nya Zeeland.", "Att vinet är handskördat och lagrat i minst två år på ekfat.", "Att vinet är certifierat av en oberoende smakpanel och lagrat på stål."]}, {"q": "Vilken region är mest känd för bordeauxblandningar och rödviner (ej pinot noir)?", "a": "Hawkes Bay.", "w": ["Marlborough.", "Central Otago.", "Wairarapa."]}, {"q": "Vilken är den näst mest odlade druvan i Marlborough efter sauvignon blanc?", "a": "Pinot noir.", "w": ["Riesling.", "Gewürztraminer.", "Muscat."]}, {"q": "Vad är speciellt med vinodlingarna i Central Otago jämfört med övriga Nya Zeeland?", "a": "Det är världens sydligaste vinområde med inlandsklimat, kalla vintrar och varma somrar.", "w": ["Det är världens sydligaste vinområde med maritimt klimat och milda vintrar.", "Det är det vindrivna området med lägst nederbörd och havsklimat.", "Det är det enda området som odlar enbart gröna druvor."]}, {"q": "Vilken region är känd för fruktiga, generösa chardonnayviner och är det östligaste vinområdet?", "a": "Gisborne.", "w": ["Marlborough.", "Hawkes Bay.", "Waipara."]}, {"q": "Vilken typ av förslutning används på 99 % av Nya Zeelands viner?", "a": "Skruvkapsyl.", "w": ["Naturkork.", "Plastkork.", "Glasstopp."]}, {"q": "Vilken ny trenddruva har blivit populär i Nya Zeeland och påminner mer om Rhône än Australien i stilen?", "a": "Syrah.", "w": ["Pinot noir.", "Merlot.", "Tempranillo."]}, {"q": "Vilka är de fyra viktigaste vinregionerna i Nya Zeeland?", "a": "Marlborough, Hawkes Bay, Central Otago och Wairarapa (Martinborough).", "w": ["Marlborough, Gisborne, Nelson och Canterbury.", "Hawkes Bay, Gisborne, Nelson och Waipara.", "Marlborough, Central Otago, Auckland och Gisborne."]}, {"q": "Vilken faktor bidrar till den höga syran i Nya Zeelands sauvignon blanc-viner?", "a": "Kombinationen av soliga dagar och svala nätter under mognadstiden.", "w": ["Hög temperatur under hela dygnet och mycket regn under hösten.", "Tidig skörd i början av februari med lite solsken.", "Mycket kalkrik jord och torra vindar från öster."]}, {"q": "Vad är Appellation Marlborough Wine (AMW) och vilka krav ställs på vinerna?", "a": "En ursprungsbeteckning för Marlborough där druvorna måste vara ekologiskt certifierade, buteljering ske i Nya Zeeland, skördeuttaget får inte vara för högt och vinerna testas av en smakpanel.", "w": ["En ursprungsbeteckning för Marlborough där druvorna måste skördas för hand och lagras i ek.", "En kvalitetsbeteckning för Nya Zeeland där vinerna endast får innehålla en druvsort.", "En beteckning för viner som exporteras till EU och som certifierats av EU:s smakpanel."]}]}, {"n": 11, "t": "Söt- och Starkviner", "items": [{"q": "Vilka två huvudsakliga metoder användes historiskt för att framställa naturligt söta viner?", "a": "Genom att använda mycket mogna druvor med höga sockerhalter och genom spontant avstannad jäsning.", "w": ["Genom att tillsätta socker till musten och genom att stoppa jäsningen med svavel.", "Genom att torka druvorna på halmmattor och genom att tillsätta druvsprit före pressning.", "Genom att skörda druvorna tidigt och genom att koncentrera musten genom kokning."]}, {"q": "Varför var söta viner mer värdefulla än andra viner historiskt sett?", "a": "Sötma var ovanligt och eftertraktat, dolde oönskade smaker och gav större intensitet i arom och smak.", "w": ["Söta viner var lättare att lagra och transportera än torra viner.", "Sötma var ett kvalitetsmärke som endast tillät kungliga producenter att göra.", "Söta viner innehöll mer alkohol och var därför billigare att skatta."]}, {"q": "Nämn tre kända vintyper som ursprungligen var söta men idag ofta finns i torra varianter.", "a": "Champagne, Savennières och Moselviner (Riesling).", "w": ["Chardonnay, Sauvignon blanc och Gewürztraminer.", "Sauternes, Tokaj och Vouvray.", "Prosecco, Cava och Riesling."]}, {"q": "Vilka klimatfaktorer är viktiga för att kunna producera söta viner?", "a": "Lång växtperiod, möjlighet till sen skörd, närhet till floder/sjöar/hav som modererar klimatet.", "w": ["Kort växtperiod, tidig skörd och avstånd från vatten och hav.", "Högt regn under hösten, jordmån med mycket lera och ingen vind.", "Kall vinter, frost under blomningen och torra nätter."]}, {"q": "Finns det någon specifik jordmån som är nödvändig för att producera söta viner?", "a": "Nej, det finns ingen specifik jordmån, men vissa jordar som kalkrik, skiffer och vulkanisk jord fungerar bra.", "w": ["Ja, endast kalkjord med högt pH fungerar för söta viner.", "Ja, endast vulkaniska jordar kan ge tillräcklig sötma.", "Ja, endast lerjordar som håller fukten kan ge ädelröta."]}, {"q": "Vad är ädelröta och vilken svamp orsakar den?", "a": "Ädelröta är en gynnsam form av röta som orsakas av svampen Botrytis Cinerea.", "w": ["Ädelröta är en frostskada på druvorna som orsakas av svampen Oidium.", "Ädelröta är en gynnsam torkningsprocess som orsakas av svampen Peronospora.", "Ädelröta är en jäsning av druvans skal som orsakas av svampen Brettanomyces."]}, {"q": "Ge två exempel på metoder för att koncentrera sockerhalten i druvor vid framställning av söta viner.", "a": "Torkning av druvor (på rankan eller i lagringsutrymmen) och pressning av frusna druvor (Eiswein).", "w": ["Frysning av musten i tankar och torkning av druvor i ugn.", "Tillsats av druvmust och kokning av musten i öppna kärl.", "Skörd i början av säsongen och längre maceration på skalen."]}, {"q": "Vilken druvsort är vanligast i tyska söta viner från Mosel och Rhen?", "a": "Riesling.", "w": ["Gewürztraminer.", "Müller-Thurgau.", "Silvaner."]}, {"q": "Vad betyder begreppet \"puttonyos\" i Tokaj-viner?", "a": "Det anger hur många korgar (puttonyos) ädelrötade druvor som tillsätts till vinet – ju fler, desto sötare vin.", "w": ["Det anger sockerhalten i gram per liter i vinet.", "Det anger hur många år vinet ska lagras på fat före försäljning.", "Det anger hur många fat som får tas ut ur källaren varje år."]}, {"q": "Vilka två huvudsakliga druvsorter används i Sauternes?", "a": "Sémillon och sauvignon blanc.", "w": ["Sémillon och colombard.", "Sauvignon blanc och chenin blanc.", "Sémillon och viognier."]}, {"q": "Vad är skillnaden mellan Beerenauslese och Trockenbeerenauslese?", "a": "Beerenauslese görs på ädelrötade och delvis torkade druvor, Trockenbeerenauslese på ädelrötade och ordentligt torkade druvor.", "w": ["Beerenauslese görs på frusna druvor, Trockenbeerenauslese på ädelrötade druvor som torkat helt.", "Beerenauslese är torrt, Trockenbeerenauslese är halvtorrt, båda på ädelrötade druvor.", "Beerenauslese görs på sen skörd utan ädelröta, Trockenbeerenauslese på frusna druvor."]}, {"q": "Vilken metod används för att framställa Eiswein?", "a": "Skörd och pressning av naturligt frusna druvor.", "w": ["Skörd i augusti och pressning av torkade druvor.", "Skörd av ädelrötade druvor och torkning på halm.", "Frysning av musten i tankar efter jäsning."]}, {"q": "Vilken druvsort dominerar i Vin Santo från Italien?", "a": "Trebbiano.", "w": ["Malvasia.", "Sangiovese.", "Vermentino."]}, {"q": "Vad innebär \"Vendange Tardive\" i Alsace?", "a": "Sent skördade druvor, ibland med inslag av ädelröta.", "w": ["Torkade druvor på halm, ofta med frysning.", "Skörd i oktober utan krav på mognad.", "Druvor som lagrats i flaska i minst tio år."]}, {"q": "Vilken region anses producera världens mest hållbara söta viner på Chenin Blanc?", "a": "Loire (Coteaux de Layon) i Frankrike.", "w": ["Sauternes i Frankrike.", "Tokaj i Ungern.", "Mosel i Tyskland."]}, {"q": "Vad är den enkla definitionen av ett starkvin enligt dokumentet?", "a": "Ett vin som förstärkts med tillsats av sprit.", "w": ["Ett vin som jäser ut helt med tillsats av kolsyra.", "Ett vin som har lagrats på ekfat i minst fem år.", "Ett vin som är sött och ofta innehåller socker."]}, {"q": "Vilka tre huvudtyper av starkvin finns enligt EU-definitionen?", "a": "Helt utjäst vin + sprit + ev. sötning; delvis jäst druvjuice + sprit; ojäst druvjuice + sprit.", "w": ["Helt utjäst vin + sprit; delvis jäst must + vatten; ojäst must + socker.", "Torrt vin + socker; delvis jäst vin + vinsyra; must + kolsyra.", "Helt utjäst vin + sprit; partiellt utjäst druvsaft + glycerol; lagrat vin + sprit."]}, {"q": "Varför började man historiskt att tillsätta sprit till vin?", "a": "För att vinet skulle hålla sig fräscht längre vid transport och för att stabilisera vinet mot bakterier och jäst.", "w": ["För att göra vinet starkare och billigare att tillverka.", "För att ge vinet sötma och en mörkare färg.", "För att kunna sälja vinet som spritdryck med lägre skatt."]}, {"q": "Vilka är de två huvudsakliga metoderna för att tillverka starkvin?", "a": "Sherrymetoden (fortifiering efter jäsning) och portvinsmetoden (fortifiering före eller under jäsningen).", "w": ["Portvinsmetoden (fortifiering efter jäsning) och sherrymetoden (fortifiering före jäsningen).", "Madeirametoden (fortifiering efter jäsning) och cognacmetoden (fortifiering efter destillation).", "Rancio-metoden (före jäsning) och solera-metoden (efter lagring)."]}, {"q": "Vilka druvsorter används främst till sherry?", "a": "Palomino Fino och Pedro Ximénez (PX); Moscatel är tillåten men används sällan.", "w": ["Grenache och Tempranillo.", "Palomino Fino och Malvasia.", "Moscatel och Sercial."]}, {"q": "Vad är \"flor\" och vilken roll spelar det i sherrytillverkning?", "a": "Flor är ett jästlager som bildas på vinets yta under jäsningen och skyddar mot oxidation samt ger sherry dess speciella smak.", "w": ["Flor är en kristallisering av vinsyra som bildas i fatet och ger sherry dess mineralkaraktär.", "Flor är ett sockerlager som bildas på druvorna och skyddar vid skörd.", "Flor är en filtrering av jäst som görs innan lagring på fat."]}, {"q": "Vad innebär solerasystemet vid lagring av sherry?", "a": "Ett system där vin blandas mellan fat av olika ålder för att skapa en jämn och komplex slutprodukt; högst 33% får tas ut varje år.", "w": ["Ett system där vin hälls direkt från ett fat till flaska utan blandning; alla fat töms varje år.", "Ett system där årgångar hålls separata på fat för att kunna märkas.", "Ett system där vin blandas med sprit för att uppnå önskad styrka."]}, {"q": "Vilka är de fyra klassiska druvsorterna för Madeira?", "a": "Sercial, Verdelho, Bual (Boal) och Malmsey (Malvasia/Malvoisie).", "w": ["Sercial, Verdejo, Boal och Malmsey.", "Palomino, Pedro Ximénez, Moscatel och Sercial.", "Tinta Negra, Bastardo, Boal och Verdelho."]}, {"q": "Hur skiljer sig fortifieringsprocessen mellan sherry och portvin?", "a": "Sherry fortifieras efter att vinet jäst ut, portvin fortifieras före eller under jäsningen för att bevara sötma.", "w": ["Sherry fortifieras före jäsningen, portvin fortifieras efter att vinet jäst ut.", "Både sherry och portvin fortifieras efter att vinet jäst ut.", "Sherry fortifieras under lagring, portvin fortifieras vid buteljering."]}, {"q": "Vad är skillnaden mellan Ruby och Tawny portvin?", "a": "Ruby är unga, fruktiga och lagras kort tid på fat; Tawny lagras längre på fat och får en nötigare, oxiderad karaktär.", "w": ["Ruby är gamla och oxiderade och lagras länge; Tawny är unga och fruktiga och lagras kort.", "Ruby är torra, Tawny är söta, båda lagras lika länge.", "Ruby görs av vita druvor, Tawny av röda."]}, {"q": "Vad är Vin Doux Naturel (VDN) och vilka druvor används oftast?", "a": "Naturligt sött vin där jäsningen avbryts med sprit; muscat, grenache, macabeo eller malvasia används oftast.", "w": ["Ett vin där jäsningen fortsätter efter att sprit tillsatts; endast cabernet och merlot används.", "Ett mousserande vin som jäser på flaska; chardonnay och pinot noir används oftast.", "Ett torrt vin som lagras under flor; palomino och fiano används oftast."]}, {"q": "Vad är Mistelle (Vin de liqueur) och hur tillverkas det?", "a": "Söt druvmust som spritas upp innan jäsning, vilket ger en söt och alkoholstark dryck.", "w": ["Ojäst druvmust som kokats ned i öppna kärl till en tjock sirap.", "Torkad druvmust som jäser på torkade skal i fat.", "Ett vin som förstärkts efter jäsningen med druvsprit."]}, {"q": "Vad innebär rancio-stil vid starkvinstillverkning?", "a": "Att vinet utsätts för syre och/eller värme för att få en maderiserad, oxiderad karaktär.", "w": ["Att vinet jäser på fat med torkade druvor för att öka sötman.", "Att vinet lagras på flaska i kyla för att bevara frisk frukt.", "Att vinet lagras under flor i fat utan påfyllning."]}, {"q": "Vad är syftet med estufagem-processen vid Madeira-tillverkning?", "a": "Att värma upp vinet för att karamellisera socker, oxidera och pastörisera vinet.", "w": ["Att kyla ner vinet för att bevara friskheten och syran.", "Att tillsätta socker för att höja alkoholen.", "Att lagra vinet på ekfat för att få vaniljton."]}, {"q": "Vilka faktorer ingår i poängsystemet \"beneficio\" för portvinsvingårdar?", "a": "Plats, altitud, sluttning, berggrund, stenighet, solexponering, vindskydd, avkastning, vinstockar, planteringstäthet, uppbindningssystem och ålder.", "w": ["Plats, altitud, vinstockarnas kön, jordens pH, vattenkvalitet och druvans färg.", "Druvsort, jäsningstemperatur, sockerhalt, syra, alkoholhalt och färg.", "Jordmån, ålder på ekfaten, skördedatum, buteljeringsår, mustvikt och pris."]}]}, {"n": 12, "t": "Mousserande Champagne", "items": [{"q": "Vilka är de tre huvuddruvorna som används i champagne?", "a": "Chardonnay, Pinot Noir och Meunier (Pinot Meunier).", "w": ["Chardonnay, Pinot gris och Pinot blanc.", "Chardonnay, Pinot Noir och Pinot blanc.", "Pinot noir, Meunier och Gamay."]}, {"q": "Vad heter de tre mest kända odlingsområdena i Champagne?", "a": "Montagne de Reims, Vallée de la Marne och Côte de Blancs.", "w": ["Montagne de Reims, Côte d’Or och Vallée de la Loire.", "Côte des Blancs, Côte de Beaune och Vallée de la Marne.", "Montagne de Reims, Aube och Côte de Nuits."]}, {"q": "Vad innebär beteckningen \"Grand Cru\" i Champagne?", "a": "Grand Cru är en klassificering för byar med högsta kvalitet (100 %) enligt det gamla Echelle des Crus-systemet. Det finns 17 Grand Cru-byar.", "w": ["Grand Cru är den lägsta klassificeringen för byar och motsvarar 80 % på Echelle des Crus. Det finns 1 ouët och Piper-Heidsieck.", "Vranken-Pommery Monopole är störst och äger bl.a. Pommery, Heidsieck och Vranken.", "Lanson-BCC är störst och äger bl.a. Lanson, Besserat de Bellefon och Boizel."]}, {"q": "Vad betyder förkortningen RM på en champagneetikett?", "a": "RM står för Récoltant-Manipulant, en druvodlare som gör champagne enbart från sina egna druvor.", "w": ["RM står för Récoltant-Maison, en producent som köper in druvor från flera odlare.", "RM står för Réserve Millésimée, en årgångschampagne som lagrats minst tio år.", "RM står för Rosé-Maison, en champagnestil som görs enbart av rosé."]}, {"q": "Vilken jordmån är typisk för Champagne och varför är den viktig?", "a": "Kritjord (belemnitkrita och micrasterkrita) är typisk och fungerar som vatten- och värmemagasin, vilket gynnar vinrankornas rötter.", "w": ["Lerjord som håller vatten och skyddar mot torka.", "Vulkaniska jordar som ger tydlig mineralitet.", "Sandjord som dränerar bra och skyddar mot filloxera."]}, {"q": "Vad är dosage och vilka sockerhalter gäller för Brut, Extra-Brut och Demi-Sec?", "a": "Dosage är tillsats av socker efter dégorgement. Brut: 0-12 g/l, Extra-Brut: 0-6 g/l, Demi-Sec: 35-50 g/l.", "w": ["Dosage är avlägsnande av jästfällningen. Brut: 0-5 g/l, Extra-Brut: 0-2 g/l, Demi-Sec: 15-25 g/l.", "Dosage är tillsats av sprit före dégorgement. Brut: 12-17 g/l, Extra-Brut: 6-12 g/l, Demi-Sec: 50-70 g/l.", "Dosage är tillsats av kolsyra efter pressning. Brut: 0-3 g/l, Extra-Brut: 3-9 g/l, Demi-Sec: 20-35 g/l."]}, {"q": "Vilken historisk betydelse har staden Reims för Champagne?", "a": "Reims var kröningsstad för franska kungar 496–1825 och bidrog till regionens berömmelse.", "w": ["Reims var Frankrikes huvudstad 496–1825 och var känd för sin vinhandel.", "Reims var hem för den första vinskolan i Frankrike och grundades 1450.", "Reims är staden där champagne först tillverkades av Dom Pérignon 1500."]}, {"q": "Vad är \"vin clair\"?", "a": "Vin clair är det stilla vita vin som bildas efter första jäsningen, innan det blir mousserande.", "w": ["Vin clair är ett mousserande vin som lagrats på flaska i minst 15 månader.", "Vin clair är det sötade vinet som tillsätts efter dégorgement.", "Vin clair är en torr champagne utan dosage."]}, {"q": "Vilka är de två viktigaste kooperativtyperna i Champagne och vad står deras förkortningar för?", "a": "CM (Coopérative Manipulant) är ett kooperativ som gör vin från medlemmarnas druvor. RC (Récoltant-Coopérateur) är en medlem i ett kooperativ som även gör vin under eget namn.", "w": ["CM (Coopérative Mousseux) är ett kooperativ som gör vin från sina egna druvor. RC (Récoltant-Champagne) är en odlare som levererar druvor till kooperativet.", "NM (Négociant-Manipulant) är ett hus som köper druvor. SR (Société de Récoltants) är en sammanslutning av odlare.", "CM (Cuvée Millésime) är en årgångscuvée. RM (Récoltant-Manipulant) är en odlare."]}, {"q": "Vad är syftet med remuage-processen?", "a": "Remuage är processen där flaskorna vrids så att jästfällningen samlas i flaskhalsen inför dégorgement.", "w": ["Remuage är processen där flaskorna kyls för att stoppa jäsningen.", "Remuage är processen där vinet fylls på med sirap efter dégorgement.", "Remuage är processen där flaskorna skakas för att blanda in sockret."]}, {"q": "Vilka är några av de kända änkorna i champagnehistorien och vilket hus är de förknippade med?", "a": "Barbe-Nicole Clicquot (Veuve Clicquot), Louise Pommery (Pommery), Mathilde Emilie Perrier (Laurent-Perrier), Camille Olry-Roederer (Louis Roederer), Lily Bollinger (Bollinger), Odette Pol-Roger (Pol Roger).", "w": ["Barbe-Nicole Clicquot (Pommery), Louise Pommery (Clicquot), Mathilde Emilie Perrier (Roederer).", "Marie-Louise de Pommery (Pommery), Louise Pol-Roger (Perrier), Lily Bollinger (Taittinger).", "Barbe-Nicole Clicquot (Moët), Mathilde Perrier (Veuve Clicquot), Camille Olry-Roederer (Krug)."]}]}, {"n": 13, "t": "Övriga Europa", "items": [{"q": "Vilket land anses vara Europas äldsta vinland?", "a": "Grekland.", "w": ["Portugal.", "Italien.", "Bulgarien."]}, {"q": "Vilken grekisk vinregion producerar enbart röda viner av druvan Xinomavro?", "a": "Naoussa PDO.", "w": ["Nemea PDO.", "Santorini PDO.", "Mantinia PDO."]}, {"q": "Vilken är den viktigaste blå druvan i Nemea PDO i Grekland?", "a": "Agiorgitiko.", "w": ["Xinomavro.", "Mavrodaphne.", "Mandilaria."]}, {"q": "Vilken druva dominerar de vita vinerna från Santorini PDO?", "a": "Assyrtiko.", "w": ["Moschofilero.", "Savatiano.", "Robola."]}, {"q": "Vilken typ av klimat har Grekland generellt för vinodling?", "a": "Medelhavsklimat med heta somrar och korta vintrar, ofta odling på hög höjd.", "w": ["Kontinentalt klimat med kalla vintrar och regn året om, ofta odling på låg höjd.", "Havsklimat med milda vintrar och jämn nederbörd, ofta odling på slätten.", "Alpint klimat med korta somrar, ofta odling på hög höjd."]}, {"q": "Vad betyder förkortningen PDO i vinlagstiftning?", "a": "Protected Designation of Origin (Skyddad ursprungsbeteckning).", "w": ["Protected Denomination of Orchards (Skyddad fruktodlingsbeteckning).", "Protected Designation of Origin (Skyddad kvalitetsbeteckning för importvin).", "Public Designation of Organics (Offentlig beteckning för ekologiska viner)."]}, {"q": "Vad är \"Kava\" i grekisk vinlagstiftning?", "a": "Ett högklassigt bordsvin med förlängd lagring, ofta inom PGI-systemet.", "w": ["Ett billigt bordsvin som säljs i lådor, ofta inom PDO-systemet.", "Ett sött vin från torkade druvor, ofta inom PGI-systemet.", "Ett mousserande vin från kooperativ, ofta inom PDO-systemet."]}, {"q": "Vilken är Ungerns mest kända vinregion för söta viner?", "a": "Tokaj.", "w": ["Eger.", "Villány.", "Szekszárd."]}, {"q": "Vilken druva är huvuddruvan i Tokajer?", "a": "Furmint.", "w": ["Hárslevelű.", "Kékfrankos.", "Olaszrizling."]}, {"q": "Vad betyder \"puttonyos\" i Tokaj-viner?", "a": "Ett mått på mängden aszúdruvor som tillsätts, vilket avgör vinets sötma.", "w": ["Ett mått på mängden socker i vinet, i gram per liter.", "Ett mått på hur många år vinet ska lagras på fat före försäljning.", "Ett mått på hur många hektar av vingården som angripits av ädelröta."]}, {"q": "Vilken rödvinstyp från Eger har fått sitt namn från en legend om tjurblod?", "a": "Egri Bikavér.", "w": ["Tokaji Aszú.", "Villányi Franc.", "Badacsonyi Szürkebarát."]}, {"q": "Vilken jordmån dominerar på Ungerns stora slätt, Pustan?", "a": "Sandjordar.", "w": ["Lerjordar.", "Lössjordar.", "Vulkaniska jordar."]}, {"q": "Vilken är den tredje mest odlade gröna druvan i Ungern?", "a": "Ezerjó.", "w": ["Olaszrizling.", "Furmint.", "Hárslevelű."]}, {"q": "Vilken är den största vinproducerande kantonen i Schweiz?", "a": "Valais.", "w": ["Vaud.", "Ticino.", "Genève."]}, {"q": "Vilken druva står för 27% av vinproduktionen i Schweiz?", "a": "Chasselas.", "w": ["Pinot noir.", "Gamay.", "Müller-Thurgau."]}, {"q": "Vilken är den mest odlade blå druvan i Schweiz?", "a": "Pinot Noir.", "w": ["Chasselas.", "Merlot.", "Gamaret."]}, {"q": "Vilken är den största skillnaden mellan schweizisk och EU:s vinlagstiftning?", "a": "Schweiz har egna vinlagar och är inte med i EU, kantonerna beslutar själva om klassificering.", "w": ["Schweiz följer EU:s vinlag men har egna druvsorter, kantonerna beslutar bara om skatten.", "Schweiz har samma vinlagar som Frankrike och klassificerar viner efter 1855 års system.", "Schweiz har strängare krav på alkoholhalt, men samma klassificering som EU."]}, {"q": "Vilken är den viktigaste klimatpåverkande faktorn för vinodling i Schweiz?", "a": "Föhnvinden och skyddande berg.", "w": ["Medelhavet och Adriatiska havet.", "Nordsjön och golfströmmen.", "Rhen och de stora sjöarna."]}, {"q": "Vilket land har mer än 80 inhemska druvsorter som bara odlas där?", "a": "Schweiz.", "w": ["Rumänien.", "Bulgarien.", "Ungern."]}, {"q": "Vilken är den mest odlade blå druvan i Bulgarien?", "a": "Merlot.", "w": ["Cabernet sauvignon.", "Pamid.", "Gamza."]}, {"q": "Vilka två huvudregioner finns i Bulgariens vinodling?", "a": "Donauslätten och Thrakiska låglandet.", "w": ["Marica-dalen och Rosendalen.", "Donauslätten och Svarta havet.", "Sofia-området och Balkanbergen."]}, {"q": "Vilken är den bäst ansedda inhemska druvan i Bulgarien?", "a": "Mavrud.", "w": ["Pamid.", "Gamza.", "Rubin."]}, {"q": "Vilken är den huvudsakliga jordmånen i Bulgariens vinodlingar?", "a": "Sandblandade jordar och bördiga slamjordar.", "w": ["Kalkrik jord och bergsjord.", "Vulkanisk jord och sandstenar.", "Granit och skiffer."]}, {"q": "Vilket land producerar ungefär lika mycket vitt som rött vin och har Feteasca alba som en viktig druva?", "a": "Rumänien.", "w": ["Bulgarien.", "Ungern.", "Moldavien."]}, {"q": "Vilket land har 32 PDO-appellationer och 13 PGI-områden?", "a": "Rumänien.", "w": ["Bulgarien.", "Grekland.", "Ungern."]}, {"q": "Vilken är den största vinproducerande regionen i Rumänien?", "a": "Moldavien (regionen, inte landet).", "w": ["Transsylvanien.", "Dobrogea.", "Muntenien."]}, {"q": "Vilken är den viktigaste klimattypen för vinodling i Rumänien?", "a": "Inlandsklimat, men tempererat vid Svarta havet.", "w": ["Medelhavsklimat med torra somrar och milda vintrar.", "Kallt havsklimat med mycket regn.", "Alpint klimat med korta somrar."]}, {"q": "Vilken är den största skillnaden mellan vinproduktionen i Rumänien och Bulgarien när det gäller export?", "a": "Schweiz exporterar endast 1,5–2% av sin vinproduktion, medan Bulgarien historiskt exporterat mycket till Sovjetunionen.", "w": ["Schweiz exporterar mer än 40 % av sin vinproduktion, medan Bulgarien aldrig exporterat vin.", "Bulgarien exporterar nästan allt till Västeuropa, medan Schweiz exporterar mest till Asien.", "Båda länderna exporterar lika stor andel, men Schweiz endast röda viner."]}, {"q": "Vad betyder \"Reserve\" i bulgarisk vinlagstiftning?", "a": "Viner som lagrats minst ett år före försäljning, gäller både PGI och PDO.", "w": ["Viner av högsta kvalitet som lagrats i fat i minst tre år.", "Viner som är gjorda av ekologiska druvor, gäller endast PDO.", "Viner som kommer från ett enda vingårdsläge, gäller både PGI och PDO."]}, {"q": "Vilken är den största utmaningen för vinexport från Schweiz?", "a": "Nästan all vinproduktion konsumeras inom landet, mycket liten export.", "w": ["Schweiz saknar tillgång till moderna vinfaciliteter.", "Hög tull från EU och höga priser på schweiziska viner.", "Svårt att skicka vin över Alperna på grund av klimatet."]}]}];

app.innerHTML=`<button class="lk" onclick="home()">← Kapitel</button><div class="top"><span>K${st.c.n} · ${st.c.t}</span><span>${st.i+1}/${n} · ${st.s} rätt</span></div><div class="bar"><i style="width:${st.i/n*100}%"></i></div><h2></h2><div id="o"></div><div id="n"></div>`;
